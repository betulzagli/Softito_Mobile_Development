<html lang="en">

<head>
    <meta charset="UTF-8">

<body>
    <script>
        
        //1. değer kopyalama
        let sayi1 = 100;
        let sayi2 = sayi1;
        sayi2 = 250;
        console.log("sayi 1", sayi1);
        console.log("sayi 2", sayi2);

        //2. dizi kopyalama
        const istasyonlarA = ["kadıköy dc", "beşiktaş ac"];
        const istasyonlarB = istasyonlarA; //b nin içeriği a yı da değiştirdi
        istasyonlarB.push("üsküdar ultra dc");
        console.log("istasyonlar a", istasyonlarA);
        console.log("istasyonlar b", istasyonlarB);
        console.log(istasyonlarA===istasyonlarB);

        //2.1 doğru dizi kopyalama
        const bagimsizKopya=[...istasyonlarA]; //...(spread operator) klonlama işine yarar eşitleme yapmaz, içeriği klonlar
        bagimsizKopya.push("maltepe hızlı");
        console.log("orijinal liste",istasyonlarA.length);
        console.log("yeni klon liste",bagimsizKopya.length);

        

        
        //dizi elemanlarımız ham veri seti
        const sarjİstasyonlari = [
            { id: "IST-01", lokasyon: "Zorlu Center", tip: "DC", gucKw: 180, durum: "Aktif", seansAdet: 45, tarifeTL: 12 },
            { id: "IST-02", lokasyon: "Akasya AVM", tip: "AC", gucKw: 22, durum: "Aktif", seansAdet: 11, tarifeTL: 9 },
            { id: "IST-03", lokasyon: "Kanyon AVM", tip: "DC", gucKw: 120, durum: "Aktif", seansAdet: 22, tarifeTL: 12 },
            { id: "IST-04", lokasyon: "Vadi İstanbul", tip: "AC", gucKw: 22, durum: "Pasif", seansAdet: 33, tarifeTL: 8.5 },
            { id: "IST-05", lokasyon: "Mall of İstanbul", tip: "DC", gucKw: 300, durum: "Pasif", seansAdet: 55, tarifeTL: 15 },
        ];

        //1. map ile döngü veriyi dönüştürür ve her elemanı işler aynı boyutta YENİ dizi döner
        const istasyonOzetleri = sarjİstasyonlari.map(ist => {
            return `${ist.lokasyon} (${ist.tip} - ${ist.gucKw}) -> ${ist.durum.toUpperCase()}`;
        });

        console.log("map sonucu", istasyonOzetleri);

        const sadeceLokasyonlar = sarjİstasyonlari.map(ist => ist.lokasyon);
        console.log("lokasyonlar", sadeceLokasyonlar);

        //2. filter() şartı sağlayanları ayıklar yani filtreler. ve yeni dizi döner
        //sadece dc ve aktif istasyonları GÖSTERSİN
        const aktifDcİstasyonlar = sarjİstasyonlari.filter(ist => ist.tip === "DC" && ist.durum === "Aktif");
        console.table(aktifDcİstasyonlar);

        //3. find ve findIndex : tekil eleman arama
        const bulunan = sarjİstasyonlari.find(ist => ist.id === "IST-03");
        console.log("bulunan istasyon", bulunan.lokasyon, bulunan.gucKw, "Kw");

        //4.some ve every - mantıksal kontroller boolean döner
        const bakimdaOlanVarmi = sarjİstasyonlari.some(ist => ist.durum === "bakim");
        const hepsiAktifmi = sarjİstasyonlari.every(ist => ist.durum === "Aktif");
        console.log("bakımda olan var mı", bakimdaOlanVarmi);
        console.log("tüm istasyonlar aktif mi", hepsiAktifmi);

        //5. reduce()  toplama 
        const toplamSeans = sarjİstasyonlari.reduce((aku, istasyon) => {
            return aku + istasyon.seansAdet;
        }, 0);//başlangıç değeri 0
        console.log("toplam yapılan şarj seansı", toplamSeans);


        //6. Zincirleme filter map reduce kullanımı
        //aktif olan dclerin toplam anlık maksimum  güç kapasitesi
        const aktifDcToplamGuc=sarjİstasyonlari.filter(ist=>ist.durum==="Aktif" && ist.tip==="DC").map(ist=>ist.gucKw).reduce((toplam,guc)=>toplam+guc,0);
        console.log("Aktif dc toplam güç kapasitesi",aktifDcToplamGuc);

        const pahaliAktifLokasyonlar=sarjİstasyonlari.filter(ist=>ist.durum==="Aktif" && ist.tarifeTL>10).map(ist=>ist.lokasyon);
        console.log("sonuç: " ,pahaliAktifLokasyonlar);

        


        
        //kapsamlı istasyon nesnesi ve metotlar
        const istasyonYonetim={
            kod:"TR-IST-006",
            ad:"Kadıköy Dc Hızlı Şarj",
            kapasiteSoket: 4,
            aktifSoketler: ["Soket-A","Soket-B"],
            tarife:{
                birimTL:12,
                geceIndirimYuzdesi:20
            },
        

        musaitlikRaporu:function(){
            const bostaAdet=this.kapasiteSoket - this.aktifSoketler.length;
            return `${this.ad} istasyonunda ${bostaAdet} adet soket boştadır.`;
        },

        geceTarifesiHesapla:function(){
            const indirim=this.tarife.birimTL * (this.tarife.geceIndirimYuzdesi/100);
            return this.tarife.birimTL - indirim;
        }

    };

    console.log(istasyonYonetim.musaitlikRaporu());
    console.log("gece birim fiyat",istasyonYonetim.geceTarifesiHesapla(), "TL");
    console.log("keys",Object.keys(istasyonYonetim));
    console.log("values",Object.values(istasyonYonetim.tarife));
    
    

    
    //obje 
    const aracVerisi={
        marka:"Togg",
        model:"T10X",
        yil:"2026",
        batarya:{
            kapasiteKwh:88.5,

            garantiYil:8
        },
        renk:"Gece Mavisi"
    };

    //eski yöntem
    const marka=aracVerisi.marka;
    const model=aracVerisi.model; 


    
    //modern es6
    const {marka,model,renk="Beyaz"}=aracVerisi;  //burada düz eşitlenen rengi algılamaz çünkü pushlanmadı. değişmesi için pushlanması gerekir. const içindeki veriler direkt değiştirilmez.
    console.log(`Araç: ${marka} ${model}  | Renk: ${renk}`);

    //iç içe ve yeniden isimlendirme
    const {batarya: {kapasiteKwh:bataryaBoyutu,kimya}}=aracVerisi; //veri çekerken isim değiştirdik
    console.log(`batarya ${bataryaBoyutu} Kwh, hücre kimyası: ${kimya}`);

    // react prop parametre ile aynı mantık
    const araciEkranaBas=({marka,model,batarya:{kapasiteKwh}}) => {
        console.log(`gelen araç ${marka} ${model} [${kapasiteKwh} kwh]`);
    }

    araciEkranaBas(aracVerisi);

    

    const koordinatlar=[41.0082,28.9785];
    const [enlem,boylam]=koordinatlar; //koordinatlar içerisinedki 0. veri enleme 1. veri boylama eşitlendi. aynı zamanda isimsiz veri isimlendirilmiş oldu.
    console.log(`Enlem ${enlem}, boylam ${boylam}`);


    const puanlar=[95,88,76,65,54];
    const [birinci,ikinci,...kalanlar]=puanlar; //bu isimlendirme hep 0. indeksten başlayarak devam eder. eğer biz baştan birkaç eleman almak istersek o fonksiyon başkadır, bu kullanılmaz. 
    console.log("şampiyon",birinci, "ikinci", ikinci, "kalanlar" ,kalanlar);

    

    
    const temelTarife={
        kdvOrani:0.20,
        paraBirimi: "TL",
        geceTarifesi:true
    }

    const guncelTarife={
        ...temelTarife,  //eski özellikleri kopyala
        birimFiyat:11.50, //yeni özellik ekle
        paraBirimi:"TRY"  //var olan özellik ezildi override edildi
    };

    console.log("yeni tarife nesnesi",guncelTarife);


























    </script>
