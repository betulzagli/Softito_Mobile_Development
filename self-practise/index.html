<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #FFFFFF;
            --text: #262626;
            --text-secondary: #8E8E8E;
            --border: #DBDBDB;
        }

        body {
            font-family: Georgia, 'Times New Roman', Times, serif;
            background-color: #f0f2f5;
            color: var(--text);
            display: flex;
            justify-content: center;
            padding: 16px;
        }

        .phone-container {
            width: 375px; 
            height: 812px; 
            display: flex;
            flex-direction: column;
            border-radius: 40px; 
            border: 10px solid #1a1a1a; 
            background-color: var(--bg);
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            position: relative;
        }

        .story-line {
            flex-shrink: 0;
            position: sticky;
            top: 0;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border: 1px solid var(--border);
            padding-bottom: 6px;
        }

        .story-circle {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 5px;
        }

        .avatar {
            border: 1px solid var(--border);
            border-radius: 50%;
            overflow: hidden;
            max-width: 60px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        .p-img {
            width: 100%;
            object-fit: cover;
        }

        .story-text {
            color: var(--text);
            font-size: 14px;


        }

        .feed {
            flex: 1;
            overflow-y: auto;
            position: relative;
            padding-bottom: 50px;
        }

        .post {
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border);
            overflow: hidden;
        }

        .post-owner {
            border-radius: 18px;
            padding: 5px;
            font-weight: 600;
            display: flex;
            align-items: center;
        }

        .post-img {
            display: flex;
            justify-content: center;
            overflow: hidden;
            width: 100%;
            padding: 0 30px;
            max-height: 400px;
        }

        .post-img img {
            width: 100%;
            max-width: 320px;
            height: 280px;
            object-fit: cover;
        }

        .bottom-menu {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-around;
            align-items: center;
            height: 50px;
            background-color: var(--bg);
            border-top: 1px solid var(--border);
            z-index: 10;
        }

        .btn-menu {
            border: none;
            background: transparent;
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 8px;
        }

        .btn-menu:hover {
            background-color: #f0f0f0;
            transform: translateY(-2px);
        }

        .post-actions{
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 10px 15px;
        }

        .post-actions button{
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 22px;
        }

        .post-actions button:hover{
            transform: translateY(-2px);
        }

    </style>
</head>

<body>
    <div class="phone-container">
        <header>
            <div class="story-line">
                <div class="story-circle">
                    <div class="avatar">
                        <img class="p-img"
                            src="https://i.pinimg.com/1200x/ff/80/b4/ff80b43125358fb6cabf46cf0740c31c.jpg">
                    </div>
                    <div class="story-text">Sen</div>
                </div>

                <div class="story-circle">
                    <div class="avatar">
                        <img class="p-img"
                            src="https://i.pinimg.com/1200x/ff/80/b4/ff80b43125358fb6cabf46cf0740c31c.jpg">
                    </div>
                    <div class="story-text">betulzagli</div>
                </div>

                <div class="story-circle">
                    <div class="avatar">
                        <img class="p-img"
                            src="https://i.pinimg.com/1200x/ff/80/b4/ff80b43125358fb6cabf46cf0740c31c.jpg">
                    </div>
                    <div class="story-text">ozumkonar</div>
                </div>

                <div class="story-circle">
                    <div class="avatar">
                        <img class="p-img"
                            src="https://i.pinimg.com/1200x/ff/80/b4/ff80b43125358fb6cabf46cf0740c31c.jpg">
                    </div>
                    <div class="story-text">nazliyilmaz</div>
                </div>
            </div>
        </header>

        <main class="feed">
            <div class="post">
                <div class="post-owner">
                    <div class="avatar">
                        <img class="p-img" style="max-width: 30px;"
                            src="https://i.pinimg.com/1200x/ff/80/b4/ff80b43125358fb6cabf46cf0740c31c.jpg">
                    </div>

                    betulzagli
                </div>

                <div class="post-img">
                    <img src="https://i.pinimg.com/736x/58/17/14/58171496a4f83eb77b8ea116195926e4.jpg">
                </div>
                <div class="post-actions">
                    <button class="like">🤍</button>
                    <button class="comment">💬</button>
                    <button class="repost">🔁</button>
                    <button class="save">💾</button>
                </div>
            </div>

            <nav class="bottom-menu">
                <button class="btn-menu">Ana Sayfa</button>
                <button class="btn-menu">Keşfet</button>
                <button class="btn-menu">+</button>
                <button class="btn-menu">Reels</button>
                <button class="btn-menu">Profil</button>
            </nav>



        </main>
    </div>
</body>

</html>
