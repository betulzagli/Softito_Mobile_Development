<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Ticaret Örnek</title>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #e6f0e9;
            --phone-bg: #d4ebd9;
            --accent: #539d72;
            --accent-hover: #43845e;
            --shipping: #f9f2d0;
            --text-main: #1d3626;
            --text-muted: #83a891;
            --bottom-bar-bg: #214230;
            --bottom-bar-text: #f0f7f2;
        }

        body {
            font-family: Georgia, 'Times New Roman', Times, serif;
            background-color: var(--bg);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            padding: 16px;
        }

        .phone-container {
            width: 100%;
            max-width: 480px;
            min-height: calc(100vh - 32px);
            background: var(--phone-bg);
            border-radius: 28px;
            overflow: hidden;
            border: 1px solid var(--bottom-bar-bg);
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 20px 40px rgba(33, 66, 48, 0.2);
            padding-bottom: 80px;
        }

        .top-bar {
            position: sticky;
            justify-content: space-between;
            display: flex;
            top: 0;
            z-index: 50;
            align-items: center;
            padding: 18px 20px;
            border-bottom: 1px solid rgba(83, 157, 114, 0.3);
            background-color: var(--phone-bg);
        }

        .search-input {
            padding: 8px 15px;
            border-radius: 20px;
            border: 1px solid var(--accent);
            width: 140px;
            background-color: #ffffff;
            color: var(--text-main);
        }

        .ust-menu {
            display: flex;
            gap: 8px;
        }

        .ust-menu button {
            color: var(--text-main);
            background: transparent;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .ust-menu button:hover {
            background-color: rgba(83, 157, 114, 0.15);
            transform: translateY(-2px);
        }

        .product-header {
            padding: 20px 20px 0 20px;
            text-align: center;
        }

        .product-title {
            font-size: 24px;
            font-weight: bold;
            color: var(--text-main);
        }

        .product-card {
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .product-img {
            position: relative;
            width: 100%;
            max-width: 320px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
        }

        .product-img img {
            width: 100%;
            display: block;
            object-fit: cover;
        }

        .discount {
            position: absolute;
            top: 12px;
            left: 12px;
            background-color: var(--accent);
            color: #ffffff;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 10px;
            font-weight: bold;
            z-index: 2;
            letter-spacing: 0.5px;
        }

        .shipping {
            position: absolute;
            top: 40px;
            left: 12px;
            background-color: var(--shipping);
            color: var(--text-main);
            padding: 6px 12px;
            border-radius: 8px;
            font-weight: bold;
            z-index: 2;
            font-size: 10px;
        }

        .size-chip {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            padding: 10px 20px 25px 20px;
        }

        .action-btn {
            background-color: transparent;
            border: 2px solid var(--accent);
            color: var(--accent);
            padding: 10px 16px;
            border-radius: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .action-btn:hover {
            background-color: var(--accent);
            color: #ffffff;
            transform: translateY(-3px);
            box-shadow: 0 4px 10px rgba(83, 157, 114, 0.3);
        }

        .bottom-bar {
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%); 
            width: 100%;
            max-width: calc(480px - 2px); 
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background-color: var(--bottom-bar-bg);
            border-radius: 0 0 28px 28px;
            box-shadow: 0 -10px 20px rgba(0, 0, 0, 0.15);
            z-index: 100;
        }

        .price-badge {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .tx-info {
            font-size: 11px;
            color: var(--text-muted);
        }

        .price {
            font-size: 18px;
            font-weight: bold;
            color: var(--bottom-bar-text);
        }

        .chart {
            display: flex;
            gap: 12px;
        }

        .add-chart, .quick-buy {
            background-color: var(--accent);
            border: none;
            color: #ffffff;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .add-chart {
            padding: 12px 24px;
            font-size: 14px;
            box-shadow: 0 4px 10px rgba(83, 157, 114, 0.4);
        }

        .quick-buy {
            padding: 10px 16px;
            font-size: 13px;
        }

        .add-chart:hover, .quick-buy:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
        }
    </style>
</head>

<body>
    <div class="phone-container">
        <header class="top-bar">
            <div>
                <input class="search-input" type="search" placeholder="Ürün ara">
            </div>
            <nav class="ust-menu">
                <button>Profil</button>
                <button>Siparişlerim</button>
                <button>Sepet</button>
            </nav>
        </header>

        <section class="product-header">
            <h1 class="product-title">iPhone 18 Pro Max</h1>
        </section>

        <section class="product-card">
            <div class="product-img">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTBqbXky-_bKT5TQN9KHEJWzhCLK8qWlGkwXbnA0qzdpw&s" alt="iPhone 18 Pro Max">
                <span class="discount">%35 İNDİRİM</span>
                <span class="shipping">KARGO BEDAVA</span>
            </div>
        </section>

        <section class="size-chip">
            <button class="action-btn">256 GB</button>
            <button class="action-btn">512 GB</button>
            <button class="action-btn">1 TB</button>
            <button class="action-btn">2 TB</button>
        </section>

        <section class="bottom-bar">
            <div class="price-badge">
                <span class="tx-info">Başlangıç fiyatı:</span>
                <strong class="price">174.898 TL</strong>
            </div>

            <div class="chart">
                <button class="add-chart">Sepete Ekle</button>
                <button class="quick-buy">Hızlı Al</button>
            </div>
        </section>
    </div>
</body>

</html>
