<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>

        
        console.log("1. sıra klinik sitesi açıldı.");
        
        setTimeout(()=>{
            console.log("2. sıra (zamanlayıcı): randevu hatılatma smsi gönderildi(macro task)")
        },0); //ms olsa bie web api tarafına gönderir.

        //buraya promise yazarak bu işlemin mikro ve öncelikli olduğunu söyledik. yani dedik ki sen makro taskin bitmesini bekleme bunu yap önce sonra makroyu alırsın.
        Promise.resolve().then(()=>{
            console.log("3. promise: vip müşeri öncelikli kaydı alındı(micro task)")
        });

        console.log("4. resepsiyon işlemleri devam ediyor");
        


        
        //piramit faciası. kesinlikle mimari hatadır. bu şekilde iç içe yapılar kullanılmaz.
        danisanbul("selim kaya",(danisan)=>{
            cilTipiAnalizEt(danisan.id),(analiz)=>{
                uygunSerumBelirle(analiz.tip,(serum)=>{
                    stokDus(serum.id,(fatura)=>{
                        console.log("işlem tamamlandı",(fatura));
                    })
                })
            }
        })

        


        
        //doğru piramit girişi
        const randevuOlustur = (danisanAdi, hizmet, uzmanMusaitmi) => {
            return new Promise((resolve, reject) => { //arkada bir işlem dönğyor ben sana ya sonuç ya hata göndericem dedi ve söz verdi.
                console.log(`${danisanAdi} için ${hizmet} seasnsı sorgulanıyor.`);



                setTimeout(() => {
                    if (uzmanMusaitmi) {
                        const randevuDetay = {
                            takipNo: "BİO-" + Math.floor(1000 + Math.random() * 9000),
                            danisan: danisanAdi,
                            hizmet: hizmet,
                            saat: "14.30",
                            onaylandi: true
                        };

                        resolve(randevuDetay) //doğru çalışırsa vereceğimiz bölüm

                    } else {
                        reject(new Error("seçilen saatte uzman randevusu doludur.")); //hata gelirse vereceğimiz bölüm
                    }
                }, 1500)//1.5 sanie sunucu gecikmesi simülasyonu
            }
            )
        }

        
        randevuOlustur("betül zağlı", "cilt analizi", true).then((randevu) => {
            console.log("randevu onaylandı.", randevu);
            return `kayıt no:${randevu.takipNo}`; //bir sonraki then bölümünde kullanılır
        }).then((mesaj)=>{
            console.log("sms gönderildi->",mesaj);
        }).catch((hata)=>{
            console.error("işlem başarısız.",hata.message);
        }).finally(()=>{
            console.log("randevu sorgylama oturumu kapatıldı/tamamlandı.");
        })
        
       
        const seansUcretiHesapla=(hizmetTipi)=>{
            return new Promise((resolve)=>{
                setTimeout(()=>{
                    const tarifeler={
                        "lazer epilasyon":2800,
                        "iğneli epilasyon":4500,
                        "lipo":6500
                    }

                    resolve (tarifeler[hizmetTipi] || 1500);
                },1000)
            })
        }

        const randevuSureciBaslat= async(danisan,hizmet)=>{
            try{
                console.log(`1. adım ${danisan} için işlem başlatılıyor...`);

                const randevu=await randevuOlustur(danisan,hizmet,true);
                console.log(`2. adım: randevu onaylandı. takip no: ${randevu.takipNo}`);
                const tutar=await seansUcretiHesapla(hizmet);
                console.log(`3. adım: seans ücreti: ${tutar} tl (kdv dahildir) kayıt tamamlandı.`);
                return {basarili:true,takipNo:randevu.takipNo,toplam:tutar};
            }catch(err){
                console.error("hata oluştu.", err.message);
                return{basarili:false,hata:err.message}
            }finally{
                console.log("seans akışı tamamlandı.");
            }
        }

        //çalıştırma
        randevuSureciBaslat("betül zağlı","lazer epilasyon");
        


        
        const serumStockKontrol= (serumAdi,istenenAdet) =>{
            return new Promise((resolve,reject) =>{
                console.log(`${serumAdi} stok bilgisi sorgulanıyor.`);


                setTimeout(()=>{
                    if(serumAdi.stock >= istenenAdet){
                        const urunBilgisi={
                            takipNo:"BİO-" + Math.floor(1000 + Math.random() * 9000),
                            urun:serumAdi,
                            stok:serumAdi.stock-istenenAdet
                        }
                        resolve(urunBilgisi);
                    }else{
                        reject(new Error(`${serumAdi} için yeterli stok bulunamamıştır.`));
                    }
                },1500)
            })
        }

        serumStockKontrol("cilt yatıştırıcı gece serumu",5).then((istek)=>{
            console.log("Ürün sepetinize eklenmiştir",istek);
        }).catch((hata)=>{
            console.error("yeterli stok bulunamadı.",hata.message);
        }).finally(()=>{
            console.log("ürün sorgulaması tamamlandı.");
        })

        

        
        const fetchDoktorlar=()=>new Promise(res=>setTimeout(()=>res(["Dr.Betül","Dr.Mehmet"]),1200));
        const fecthOdaMusaitlik=()=>new Promise(res=>setTimeout(()=>res(["VIP Oda","Lazer Odası"]),800));
        const fetchGunlukKampanya=()=>new Promise(res=>setTimeout(()=>res(["%15 Sonbahar Kampanyası","2 masaj alana bir hediye"]),1000));

        const verileriYukle=async()=>{
            console.time("paralel yükleme süresi");
            try{
                const [doktorlar,odalar,kampanyalar]=await Promise.all([
                    fetchDoktorlar(),
                    fecthOdaMusaitlik(),
                    fetchGunlukKampanya()
                ]);
                console.log("doktorlar:",doktorlar);
                console.log("odalar:",odalar);
                console.log("kampanyalar:",kampanyalar);
            }catch(err){
                console.error("herhangi bir istek başarısız olursa hepsi düşer.",err);
            }

            console.timeEnd("paralel yükleme süresi");
        }
        verileriYukle();
        

        //rest api ile dışarıdan veri çekme
        const kozmetikUurnkeriniGetir=async()=>{
            try{
                console.log("harici apiye bağlanılıyor");
                const response = await fetch ("https://dummyjson.com/products/category/beauty");

                if(!response.ok){
                    throw new Error(`http hatası ${response.status}` );
                }

                const data =await response.json();
                console.log(`toplam ${data.products.length} adet kozmetik ürün çekildi.`);

                const vitrin=data.products.slice(0,3).map(p=>({
                    urun:p.title,
                    fiyat:p.price,
                    stok:p.stock
                }));
                console.table(vitrin);
            }catch(err){
                console.warn("api hatası",err.message);

            }
        }

        kozmetikUurnkeriniGetir();


        //kategori vermeden fetch ile ürün seç ilk gelen birinci ve ikinci ürünü kabul etmeyip sonraki 5 ürünü al.
        //isim, açıklama,kategori,stok,fiyat,etiket
        const UrunleriGetir=async()=>{
            try{
                console.log("harici apiye bağlanılıyor");
                const response = await fetch ("https://dummyjson.com/products");

                if(!response.ok){
                    throw new Error(`http hatası ${response.status}` );
                }

                const data =await response.json();
                console.log(`toplam ${data.products.length} adet kozmetik ürün çekildi.`);

                const vitrin=data.products.slice(2,7).map(p=>({
                    urun:p.title,
                    fiyat:p.price,
                    stok:p.stock,
                    kategori:p.category,
                    aciklama:p.description,
                    etiket:p.tags.join(",")
                }));
                console.table(vitrin);
            }catch(err){
                console.warn("api hatası",err.message);

            }
        }
        UrunleriGetir();


































    </script>
</body>

</html>
